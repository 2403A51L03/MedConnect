services:
  postgres:
    image: postgres:16
    container_name: medconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medconnect
    ports:
      - "5432:5432"
    volumes:
      - medconnect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medconnect-postgres-data:
